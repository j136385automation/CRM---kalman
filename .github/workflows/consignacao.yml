name: Consignações e contratos

on:
  pull_request:
  push:
    branches:
      - feat/consignacao-contratos
      - refactor/prioridade-pacotes

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kalman_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - name: Lint das funcionalidades alteradas
        run: bunx oxlint --deny-warnings src/features/consignacao src/features/contratos src/app/dashboard/consignacoes src/app/dashboard/contratos src/features/estoque src/config/nav-config.ts
      - run: bun run test:consignacao
      - name: Migração, isolamento de empresas e imutabilidade
        run: bun run test:database
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/kalman_tests
